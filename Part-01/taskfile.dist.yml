version: '3'

tasks:
  up:
    dir:  '{{.USER_WORKING_DIR}}'
    preconditions:
      - test -f docker-compose.yml
    description: "Bring the system up"
    cmds: 
      - docker-compose up -d
  
  down:
    dir:  '{{.USER_WORKING_DIR}}'
    preconditions:
      - test -f docker-compose.yml
    description: "Bring the system down"
    cmds: 
      - docker-compose down